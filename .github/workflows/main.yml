name: Production Pipeline

on:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "pnpm" }
      - run: pnpm install
      - run: pnpm --filter @repo/database run generate
      - run: pnpm turbo run lint type-check

  deploy-api:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        run: |
          # We use vars. for non-sensitive data
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          REPO=${{ vars.ECR_REPO_NAME }}
          docker build -t $REGISTRY/$REPO:latest .
          docker push $REGISTRY/$REPO:latest

      - name: Deploy App Runner
        run: |
          aws apprunner start-deployment \
            --service-arn ${{ vars.APP_RUNNER_ARN }} \
            --region ${{ vars.AWS_REGION }}

  deploy-web:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./