name: Production Pipeline

on:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "pnpm" }
      - run: pnpm install
      - run: pnpm --filter @repo/database run generate
      - run: pnpm turbo run lint type-check

  deploy-api:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & Push
        env:
          ECR: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPO_NAME }}
        run: |
          echo "Syncing to Registry: $ECR"
          docker build -t $ECR/$REPO:latest .
          docker push $ECR/$REPO:latest
      - name: Deploy App Runner
        run: |
          aws apprunner start-deployment \
            --service-arn ${{ secrets.APP_RUNNER_ARN }} \
            --region ${{ secrets.AWS_REGION }}

  deploy-web:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with: { version: 10 }
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: "pnpm" }

      - name: Install Dependencies
        run: pnpm install

      - name: Generate Database Client
        run: pnpm --filter @repo/database run generate

      - name: Pull Vercel Project Settings
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        # 🚀 THE CRITICAL FIX: Added --no-turbo to disable the failing Turbopack inference
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web --no-turbo
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          vercel-args: '--prod --prebuilt'
          working-directory: ./apps/web